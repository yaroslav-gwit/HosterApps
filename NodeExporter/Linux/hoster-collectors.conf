# Hoster-managed node_exporter collector override.
#
# Installed by deploy.sh --hoster-collectors at:
#   /etc/systemd/system/node_exporter.service.d/hoster-collectors.conf
#
# Pins node_exporter to a curated allow-list so the metric set is identical
# across every Hoster host, regardless of distro, kernel modules, or future
# node_exporter releases adding new default collectors.
#
# To revert to upstream defaults: rm this file, systemctl daemon-reload,
# systemctl restart node_exporter.

[Service]
ExecStart=
ExecStart=/usr/bin/node_exporter --collector.disable-defaults --collector.cpu --collector.cpufreq --collector.diskstats --collector.entropy --collector.filefd --collector.filesystem --collector.hwmon --collector.loadavg --collector.meminfo --collector.netdev --collector.netstat --collector.os --collector.pressure --collector.processes --collector.schedstat --collector.sockstat --collector.stat --collector.systemd --collector.textfile --collector.thermal_zone --collector.time --collector.timex --collector.uname --collector.vmstat --collector.zfs
